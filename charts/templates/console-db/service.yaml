{{- if .Values.console.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: keenpgo-console-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keenpg-operator.consoleDbLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "keenpg-operator.consoleDbSelectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.console.db.port }}
      targetPort: postgres
{{- end }}
