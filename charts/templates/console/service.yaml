{{- if .Values.console.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: keenpgo-console
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keenpg-operator.consoleLabels" . | nindent 4 }}
  {{- with .Values.console.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.console.service.type }}
  selector:
    {{- include "keenpg-operator.consoleSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.console.service.port }}
      targetPort: http
      {{- if and (eq .Values.console.service.type "NodePort") .Values.console.service.nodePort }}
      nodePort: {{ .Values.console.service.nodePort }}
      {{- end }}
{{- end }}
