apiVersion: keenpg.io/v1beta1
kind: KeenPostgresCluster
metadata:
  name: hippo-s3
spec:
  postgresVersion: 18
  instances:
    - dataVolumeClaimSpec:
        accessModes:
        - "ReadWriteOnce"
        resources:
          requests:
            storage: 1Gi
  backups:
    pgbackrest:
      configuration:
      - secret:
          name: keenpgo-s3-creds
      global:
        repo1-path: /pgbackrest/keenpgo/hippo-s3/repo1
      repos:
      - name: repo1
        s3:
          bucket: "<YOUR_AWS_S3_BUCKET_NAME>"
          endpoint: "<YOUR_AWS_S3_ENDPOINT>"
          region: "<YOUR_AWS_S3_REGION>"
