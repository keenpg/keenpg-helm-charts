{{- if and .Values.console.enabled (not .Values.console.db.existingSecret) }}
{{- /* Keep the password across upgrades; generate one the first time. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "keenpgo-console-db" | default dict }}
{{- $data := get $existing "data" | default dict }}
{{- $old := get $data "password" | default "" | b64dec }}
{{- $password := .Values.console.db.password | default $old | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: keenpgo-console-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keenpg-operator.consoleDbLabels" . | nindent 4 }}
  annotations:
    # The database keeps the password it was first started with and its volume
    # outlives the release, so the Secret must too.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ $password | quote }}
{{- end }}
