{{- if .Values.pullSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keenpg-operator.pullSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keenpg-operator.commonLabels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ required "pullSecret.dockerconfigjson is required when pullSecret.create=true" .Values.pullSecret.dockerconfigjson | b64enc }}
{{- end }}
