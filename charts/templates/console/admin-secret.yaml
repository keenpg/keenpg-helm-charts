{{- if and .Values.console.enabled (not .Values.console.admin.existingSecret) }}
{{- /* Keep the password across upgrades; generate one the first time. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "keenpgo-console-admin" | default dict }}
{{- $data := get $existing "data" | default dict }}
{{- $old := get $data "password" | default "" | b64dec }}
{{- $password := .Values.console.admin.password | default $old | default (randAlphaNum 20) }}
apiVersion: v1
kind: Secret
metadata:
  name: keenpgo-console-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keenpg-operator.consoleLabels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.console.admin.username | quote }}
  password: {{ $password | quote }}
{{- end }}
